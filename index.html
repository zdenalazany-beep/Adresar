<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1f2937">
    <meta name="description" content="Jednoduchý univerzální adresář kontaktů">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <title>Adresář</title>
</head>

<body>
    <header class="topbar">
        <div class="brand">📒 Adresář</div>
        <button id="newButton" class="primary-button">＋ Nový kontakt</button>
    </header>

    <main class="container">
        <div class="toolbar">
            <input
                id="searchInput"
                type="search"
                placeholder="Hledat jméno, telefon, adresu, e-mail..."
                autocomplete="off"
            >
            <button id="reloadButton" class="secondary-button">↻ Obnovit</button>
        </div>

        <div id="status" class="status"></div>

        <section class="table-wrapper">
            <table id="contactsTable">
                <thead>
                    <tr>
                        <th>Foto</th>
                        <th>Jméno</th>
                        <th>Telefon</th>
                        <th>Adresa</th>
                        <th>E-mail</th>
                        <th>Kód</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="contactsBody"></tbody>
            </table>
        </section>

        <section id="mobileList" class="mobile-list"></section>
    </main>

    <div id="modal" class="modal hidden">
        <div class="modal-card">
            <div class="modal-header">
                <h2 id="modalTitle">Nový kontakt</h2>
                <button id="closeButton" class="close-button">×</button>
            </div>

            <form id="contactForm">
                <input id="contactId" type="hidden">

                <div class="form-grid">
                    <label>
                        Jméno
                        <input id="name" required>
                    </label>

                    <label>
                        Příjmení
                        <input id="surname">
                    </label>

                    <label>
                        Telefon
                        <input id="phone" type="tel">
                    </label>

                    <label>
                        Telefon 2
                        <input id="phone2" type="tel">
                    </label>

                    <label>
                        E-mail
                        <input id="email" type="email">
                    </label>

                    <label>
                        Kód
                        <input id="code">
                    </label>

                    <label>
                        PSČ
                        <input id="zip">
                    </label>

                    <label>
                        Město
                        <input id="city">
                    </label>

                    <label class="full-width">
                        Adresa
                        <input id="address">
                    </label>

                    <label class="full-width">
                        Poznámka
                        <textarea id="note" rows="3"></textarea>
                    </label>

                    <label class="full-width">
                        Fotografie
                        <input id="photoFile" type="file" accept="image/*">
                    </label>

                    <div class="photo-preview-wrapper full-width">
                        <img id="photoPreview" class="photo-preview hidden" alt="Náhled fotografie">
                    </div>
                </div>

                <div class="form-actions">
                    <button type="button" id="cancelButton" class="secondary-button">
                        Zrušit
                    </button>
                    <button type="submit" class="primary-button">
                        Uložit
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
