<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1f2937"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"><title>Adresář</title></head><body><header><h1>📒 Adresář</h1><button id="newBtn">＋ Nový</button></header><main><div class="toolbar"><input id="search" placeholder="Hledat…"><button id="reload" class="secondary">↻</button></div><div id="status">Připravuji…</div><section class="desktop table"><table><thead><tr><th>Foto</th><th>Jméno</th><th>Telefon</th><th>Adresa</th><th>E-mail</th><th>Kód</th><th></th></tr></thead><tbody id="tbody"></tbody></table></section><section id="cards" class="cards"></section></main><div id="modal" class="modal"><form class="card" id="form"><h2 id="formTitle">Nový kontakt</h2><input type="hidden" id="id"><div class="photo-row"><img id="preview" class="photo" src="" alt=""><div><label class="upload">📷 Vybrat fotografii<input id="photo" type="file" accept="image/*"></label><small>Fotografie se uloží na Google Drive.</small></div></div><div class="grid"><div><label>Jméno</label><input id="name"></div><div><label>Příjmení</label><input id="surname"></div><div><label>Telefon</label><input id="phone" type="tel"></div><div><label>Telefon 2</label><input id="phone2" type="tel"></div><div><label>E-mail</label><input id="email" type="email"></div><div><label>Kód</label><input id="code"></div><div><label>PSČ</label><input id="zip"></div><div><label>Město</label><input id="city"></div><div class="full"><label>Adresa</label><input id="address"></div><div class="full"><label>Poznámka</label><textarea id="note" rows="3"></textarea></div></div><div class="form-actions"><button type="button" class="secondary" id="cancel">Zrušit</button><button>Uložit</button></div></form></div><script src="app.js"></script></body></html>
